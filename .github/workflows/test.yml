name: test

on:
  push:
    branches:
      - main
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  # Tests and lint are separate jobs on purpose: a formatting failure should not
  # hide whether the test suites pass. They report as independent checks.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v2.0.1
        with:
          version: 9.0.3

      - name: Install deps
        run: pnpm i

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge build
        run: pnpm build
        id: build

      - name: Run tests
        run: pnpm test
        id: test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v2.0.1
        with:
          version: 9.0.3

      - name: Install deps
        run: pnpm i

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Lint
        run: pnpm lint
        id: lint
