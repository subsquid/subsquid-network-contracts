# Contracts that sit behind a proxy, checked by tools/upgrade-safety/check.sh.
# One contract per line, optionally followed by extra options for the validator.

Router

# Two things the validator rejects are how the deployed GatewayRegistry is written, and
# changing them now would not change the proxy that is live:
# - its constructor only calls _disableInitializers(), without the annotation the validator
#   looks for;
# - initialize() calls AccessControlledPausableUpgradeable.initialize() and not
#   PausableUpgradeable's own initializer, which only sets `paused` to its default, false.
# Both are allowed for this contract only. Storage is still compared with the baseline.
GatewayRegistry --unsafeAllow constructor,missing-initializer-call
