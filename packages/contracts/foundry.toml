[profile.default]
src = "src"
out = "artifacts"
# The compiler settings are spelled out so the build does not depend on forge's defaults or
# on which solc versions happen to be installed. Foundry 1.0 turned the optimizer off by
# default; the contracts deployed before that were built with it on, at 200 runs.
# One exception is live: the NetworkController at 0xd365C790cEF04492F3fC0811a998271f2f55D69b
# (deployed 2026-11-12) was built with the optimizer off. To reproduce or verify it, run
# forge with FOUNDRY_OPTIMIZER=false.
solc = "0.8.20"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "openzeppelin-contracts/contracts=lib/openzeppelin-contracts/contracts/",
    "@prb/math=lib/prb-math/",
]
fs_permissions = [{ access = "read-write", path = "./"}]

[fmt]
int_types = "long"
tab_width = 2

[rpc_endpoints]
arbitrum-sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
arbitrum = "https://arb1.arbitrum.io/rpc"

[etherscan]
# One Etherscan V2 key covers every chain. Put ETHERSCAN_API_KEY in packages/contracts/.env (gitignored); forge loads it.
arbitrum-sepolia = { key = "${ETHERSCAN_API_KEY}" }
arbitrum = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
