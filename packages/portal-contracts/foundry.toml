[profile.ci]

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned so that a newer forge cannot change the bytecode by changing its default. Other profiles inherit it.
evm_version = "prague"
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
# Adds each contract's storage layout to its artifact, for tools/export-artifacts.mjs. Does not affect bytecode.
extra_output = ["storageLayout"]

[profile.arbitrum]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
code_size_limit = 49152  # 48KB - Arbitrum supports larger contracts

# Coverage configuration - exclude test files and scripts
[profile.default.fuzz]
runs = 256

[etherscan]
# One Etherscan V2 key covers every chain. Put ETHERSCAN_API_KEY in packages/portal-contracts/.env (gitignored); forge loads it.
arbitrum = { key = "${ETHERSCAN_API_KEY}" }
arbitrum-sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
